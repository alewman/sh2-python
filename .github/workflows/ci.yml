name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Rungs 0 and 3: the decode table, the modules, every PM section 7 figure.
      - run: python -m pytest -q
      - run: python -m ruff check .

  # Rung 1: the 16,600 committed cases (MAME and jgenesis agreement plus the
  # manual rulings), and rung 4's CPU-resident loops from DN's committed
  # extract. The rung-2 replays need MAME traces (~5 GB each) and run
  # locally only.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m slow tests/test_rung1.py tests/test_rung4.py
